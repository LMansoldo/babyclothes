name: babyclothes

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: babyclothes
      POSTGRES_PASSWORD: babyclothes
      POSTGRES_DB: babyclothes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U babyclothes"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://babyclothes:babyclothes@postgres:5432/babyclothes
      # Usado pela config de teste (mix test roda contra babyclothes_test)
      DB_HOST: postgres
      GRPC_AGENT_URL: agents:50051
      AGENTS_HTTP_URL: http://agents:50052
      MIX_ENV: dev
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - ./proto:/proto

  agents:
    build:
      context: .
      dockerfile: docker/agents.Dockerfile
    ports:
      - "50051:50051"
      - "50052:50052"
    env_file: .env
    environment:
      INTERNAL_API_URL: http://api:4000
    volumes:
      - ./apps/agents:/app/apps/agents
    depends_on:
      - api

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "5173:5173"
    env_file: .env
    environment:
      # Usada apenas em codigo server-side (hooks, proxy /api, actions do login);
      # dentro da rede Docker a API responde em api:4000, nao em localhost
      PUBLIC_API_URL: http://api:4000
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/design-system:/app/packages/design-system
    depends_on:
      - api

volumes:
  postgres_data:
